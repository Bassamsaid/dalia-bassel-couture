<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#e34a86" />
<title>Dalia Bassel Couture</title>
<style>
:root{
  --bg:#f6f4fb; --card:#ffffff; --ink:#221826; --muted:#79708c;
  --purple:#8b5cf6; --purple-d:#7c3aed; --pink:#e24a8b; --pink-d:#d63384;
  --soft:#eee9fb; --soft2:#f7edf6; --tint:#f1ecfc;
  --line:#e9e4f2; --ok:#3f8f66; --warn:#c08a2a; --bad:#d24b62;
  --grad:linear-gradient(135deg,#7c3aed 0%,#a24fd6 45%,#e24a8b 100%);
  --grad-soft:linear-gradient(135deg,#ffffff 0%,#f3eefc 100%);
  --shadow:0 10px 30px rgba(90,60,150,.10); --shadow-sm:0 4px 14px rgba(90,60,150,.07);
  --r:16px;
  --serif:"Didot","Bodoni MT","Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"Helvetica Neue",-apple-system,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);
  direction:ltr;line-height:1.55;font-size:15px;-webkit-font-smoothing:antialiased;letter-spacing:.2px}
a{color:var(--purple-d);text-decoration:none}
img{max-width:100%}
.hidden{display:none!important}
h1,h2,h3,.serif{font-family:var(--serif);letter-spacing:.3px;font-weight:700;color:var(--ink)}
::selection{background:var(--soft)}

/* ===== keyframes (used sparingly) ===== */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes zoomIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes ripple{to{transform:scale(4);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Auth ===== */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(120% 80% at 50% 0%,#efe7fb 0%,#f6f4fb 55%,#f7eef5 100%)}
.auth-card{background:var(--card);width:100%;max-width:390px;border-radius:24px;padding:42px 28px;
  box-shadow:var(--shadow);text-align:center;border:1px solid var(--line);animation:zoomIn .4s ease both}
.brand-mark{width:96px;height:96px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;
  justify-content:center;background:var(--grad);color:#fff;font-family:var(--serif);
  font-size:38px;font-weight:600;letter-spacing:1px;box-shadow:0 12px 28px rgba(124,58,237,.35)}
.brand-title{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:2px;margin:0;
  text-transform:uppercase;color:var(--ink)}
.brand-sub{color:var(--purple-d);font-size:11px;margin:7px 0 26px;letter-spacing:4px;text-transform:uppercase;font-weight:700}

/* ===== Layout ===== */
.app{max-width:1100px;margin:0 auto;padding-bottom:92px}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 16px}
.topbar .logo{width:40px;height:40px;border-radius:50%;background:var(--grad);
  color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;letter-spacing:.5px}
.topbar h1{font-size:15px;margin:0;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--ink)}
.topbar .who{margin-inline-start:auto;font-size:12px;color:var(--muted);text-align:end;line-height:1.35}
.btn-icon{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:6px;transition:transform .15s,color .15s}
.btn-icon:active{transform:scale(.85);color:var(--purple-d)}

.content{padding:16px}
.page-title{font-family:var(--serif);font-size:24px;font-weight:700;margin:8px 2px 16px;letter-spacing:.3px;
  display:flex;align-items:center;gap:8px;color:var(--ink);animation:rise .35s ease both}

/* ===== Bottom nav ===== */
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;overflow-x:auto;max-width:1100px;margin:0 auto;
  box-shadow:0 -6px 22px rgba(90,60,150,.06);padding-bottom:env(safe-area-inset-bottom)}
.bottomnav::-webkit-scrollbar{display:none}
.bottomnav button{flex:0 0 auto;min-width:66px;background:none;border:none;padding:10px 10px 8px;
  color:var(--muted);font-size:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
  letter-spacing:.4px;text-transform:uppercase;font-weight:700;position:relative;transition:color .2s}
.bottomnav button .ic{font-size:19px;transition:transform .2s ease}
.bottomnav button.active{color:var(--purple-d)}
.bottomnav button.active .ic{transform:translateY(-2px)}
.bottomnav button.active::after{content:"";position:absolute;bottom:3px;width:18px;height:3px;border-radius:3px;background:var(--grad)}

/* ===== Cards & grid ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;
  box-shadow:var(--shadow-sm);margin-bottom:14px}
.content>.card:first-of-type{animation:rise .35s ease both}
.grid{display:grid;gap:12px}
.grid.g2{grid-template-columns:repeat(2,1fr)}
.grid.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:560px){.grid.g3{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--grad-soft);border:1px solid var(--line);border-radius:var(--r);
  padding:17px 12px;text-align:center;transition:transform .15s}
.stat:active{transform:scale(.98)}
.stat .n{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--ink)}
.stat .l{font-size:10.5px;color:var(--muted);margin-top:4px;letter-spacing:1px;text-transform:uppercase;font-weight:700}

/* ===== Tiles (home menu) ===== */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 10px;text-align:center;
  box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .16s,box-shadow .2s}
.tile:active{transform:scale(.96)}
.tile:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.tile .em{width:50px;height:50px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;
  justify-content:center;font-size:22px;background:var(--soft)}
.tile .t{font-size:12px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--ink)}

/* ===== Forms ===== */
label{display:block;font-size:11px;color:var(--muted);margin:13px 0 5px;font-weight:700;
  letter-spacing:.8px;text-transform:uppercase}
input,select,textarea{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;
  font:inherit;background:#fff;color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px var(--tint)}
textarea{min-height:80px;resize:vertical}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--grad);color:#fff;border:none;border-radius:11px;padding:13px 18px;font:inherit;font-weight:700;
  cursor:pointer;width:100%;transition:transform .12s,box-shadow .2s;letter-spacing:.8px;text-transform:uppercase;
  font-size:13px;box-shadow:0 8px 18px rgba(124,58,237,.24)}
.btn:active{transform:scale(.98)}
.btn.sec{background:#fff;color:var(--purple-d);border:1.5px solid var(--purple);box-shadow:none}
.btn.ghost{background:var(--soft);color:var(--purple-d);box-shadow:none}
.btn.sm{width:auto;padding:8px 14px;font-size:11px;border-radius:9px;box-shadow:none}
.btn.danger{background:#fff;color:var(--bad);border:1.5px solid #ecccd2;box-shadow:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);
  animation:ripple .6s linear;pointer-events:none}

/* ===== List items ===== */
.item{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .av{width:44px;height:44px;border-radius:50%;background:var(--soft);color:var(--purple-d);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--serif);flex:0 0 auto;font-size:16px}
.item .main{flex:1;min-width:0}
.item .main .nm{font-weight:700;color:var(--ink)}
.item .main .sub{font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-size:10px;padding:3px 10px;border-radius:20px;background:var(--soft);
  color:var(--purple-d);font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.badge.ok{background:#e3f1ea;color:var(--ok)}
.badge.warn{background:#f6eed9;color:var(--warn)}
.badge.bad{background:#f6e0e4;color:var(--bad)}

/* ===== Table ===== */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:440px;background:#fff}
th,td{padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right;color:var(--ink)}
th:first-child,td:first-child{text-align:left;font-weight:700}
th{background:var(--tint);color:var(--purple-d);font-weight:700;position:sticky;top:0;
  letter-spacing:.6px;text-transform:uppercase;font-size:10.5px}
tbody tr:nth-child(even){background:#faf8fd}
tbody tr:last-child td{border-bottom:none}
tfoot td{font-weight:800;background:var(--tint);color:var(--ink);border-top:2px solid var(--soft)}

/* ===== Thumbs / gallery ===== */
.thumb{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;cursor:pointer;background:var(--soft);
  transition:transform .16s}
.thumb:active{transform:scale(.98)}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:560px){.gallery{grid-template-columns:repeat(2,1fr)}}

/* ===== Modal / lightbox ===== */
.modal-back{position:fixed;inset:0;background:rgba(34,24,38,.5);backdrop-filter:blur(2px);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fadeIn .2s both}
@media(min-width:600px){.modal-back{align-items:center;padding:20px}}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:22px;animation:slideUp .3s cubic-bezier(.2,.8,.2,1) both}
@media(min-width:600px){.modal{border-radius:20px;animation:zoomIn .25s ease both}}
.modal h3{margin:0 0 14px;font-size:20px;font-weight:700;color:var(--ink)}
.modal .close{position:sticky;top:-22px;float:right;background:none;border:none;font-size:24px;color:var(--muted);cursor:pointer}
.lightbox{position:fixed;inset:0;background:rgba(20,14,26,.94);z-index:80;display:flex;align-items:center;
  justify-content:center;padding:14px;flex-direction:column;gap:10px;animation:fadeIn .2s both}
.lightbox img{max-width:100%;max-height:82vh;border-radius:10px;object-fit:contain}
.lightbox .cap{color:#fff;font-size:14px;letter-spacing:.5px}
.lightbox .x{position:absolute;top:14px;right:14px;color:#fff;font-size:30px;background:none;border:none;cursor:pointer}

/* ===== Misc ===== */
.empty{text-align:center;color:var(--muted);padding:44px 10px}
.empty .em{font-size:38px;margin-bottom:10px;opacity:.45}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;
  padding:12px 22px;border-radius:30px;font-size:13px;z-index:90;box-shadow:var(--shadow);opacity:0;
  transition:opacity .25s,transform .25s;max-width:90%;text-align:center;letter-spacing:.3px;font-weight:600}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sec-title{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--ink);margin:20px 2px 10px;
  display:flex;align-items:center;gap:6px;letter-spacing:.3px}
.chip{display:inline-flex;align-items:center;gap:5px;background:#fff;color:var(--muted);
  border:1.5px solid var(--line);border-radius:22px;padding:7px 14px;font-size:12px;cursor:pointer;font-weight:700;
  letter-spacing:.3px;white-space:nowrap;transition:all .18s}
.chip.active{background:var(--grad);color:#fff;border-color:transparent}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.filters::-webkit-scrollbar{display:none}
.muted{color:var(--muted)}
.right{text-align:end}
.spinner{border:2.5px solid var(--soft);border-top-color:var(--purple);border-radius:50%;width:28px;height:28px;
  animation:spin .7s linear infinite;margin:44px auto}
.err{color:var(--bad);font-size:13px;margin-top:8px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.divider{height:1px;background:var(--line);margin:16px 0}
.q-timer{font-weight:800;color:var(--bad)}
.opt{display:block;border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:8px;cursor:pointer;
  transition:border-color .15s,background .15s}
.opt.sel{border-color:var(--purple);background:var(--tint);font-weight:600}

/* ===== Hero banner (home) ===== */
.hero{position:relative;border-radius:20px;overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow);
  animation:rise .4s ease both}
.hero.hero-brand{background:var(--grad);color:#fff;padding:34px 18px;text-align:center}
.hero-mark{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;
  justify-content:center;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.5);
  font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:1px}
.hero-name{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:4px;text-transform:uppercase}
.hero-sub{font-size:11px;letter-spacing:5px;text-transform:uppercase;margin-top:6px;opacity:.92;font-weight:700}
.hero.hero-photo{aspect-ratio:16/10;background-size:cover;background-position:center;cursor:pointer}
.hero-cta{position:absolute;bottom:10px;inset-inline-end:10px;background:rgba(255,255,255,.92);color:var(--purple-d);
  border:none;border-radius:20px;padding:7px 13px;font:inherit;font-size:11px;font-weight:700;cursor:pointer;
  letter-spacing:.5px;box-shadow:var(--shadow-sm)}

/* ===== Side drawer ===== */
.profile-btn{margin-inline-start:auto;display:flex;align-items:center;gap:8px;background:none;border:none;
  cursor:pointer;padding:4px;font:inherit}
.profile-btn .who{text-align:end;font-size:12px;color:var(--muted);line-height:1.35}
.profile-btn .pav{width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;display:flex;
  align-items:center;justify-content:center;font-weight:700;font-size:13px;font-family:var(--serif)}
.drawer-back{position:fixed;inset:0;background:rgba(34,24,38,.45);backdrop-filter:blur(2px);z-index:70;animation:fadeIn .2s both}
.drawer{position:absolute;top:0;inset-inline-start:0;height:100%;width:78%;max-width:300px;background:#fff;
  box-shadow:2px 0 30px rgba(90,60,150,.2);padding:20px 16px;display:flex;flex-direction:column;
  animation:drawerIn .28s cubic-bezier(.2,.8,.2,1) both;overflow:auto}
@keyframes drawerIn{from{transform:translateX(-100%)}to{transform:translateX(0)}}
.drawer-head{display:flex;align-items:center;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:12px}
.drawer-head .logo{width:46px;height:46px;border-radius:50%;background:var(--grad);color:#fff;display:flex;
  align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:16px}
.drawer-head .dn{font-weight:700;font-family:var(--serif);font-size:17px}
.drawer-head .dr{font-size:12px;color:var(--muted)}
.drawer-nav{display:flex;flex-direction:column;gap:2px;flex:1}
.draw-item{display:flex;align-items:center;gap:12px;background:none;border:none;cursor:pointer;
  padding:12px 12px;border-radius:11px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);text-align:start;
  transition:background .15s}
.draw-item .ic{font-size:18px;width:22px;text-align:center}
.draw-item:active{background:var(--soft)}
.draw-item.active{background:var(--tint);color:var(--purple-d)}

</style>
</head>
<body>
<div id="root"><div class="spinner"></div></div>
<div id="modal-root"></div>
<div id="toast" class="toast"></div>
<script>
'use strict';
/* Daliessa Academy — IN-BROWSER demo backend.
   Replaces the network api() with a localStorage-backed store so the whole
   app runs client-side (for the try-it-now demo artifact). Same routes as server.js. */

const LS = 'daliessa_demo_v3';
/* storage that never throws — falls back to memory if localStorage is blocked (sandboxed preview) */
const _mem = {};
const ST = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return k in _mem ? _mem[k] : null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { _mem[k] = v; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { delete _mem[k]; } },
};
let DB = null;
try { DB = JSON.parse(ST.get(LS) || 'null'); } catch (e) {}
if (!DB) { DB = seedDB(); persist(); }
let SESSION = Number(ST.get(LS + '_sess') || 0) || null;

function persist() { try { ST.set(LS, JSON.stringify(DB)); } catch (e) { /* quota */ } }
function nid() { DB._seq = (DB._seq || 1000) + 1; return DB._seq; }
function nowIso() { return new Date().toISOString().slice(0, 19).replace('T', ' '); }
function upload(v) { if (typeof v === 'string' && v.startsWith('data:')) { const k = 'up_' + (++DB._up); DB.uploads[k] = v; return k; } return v || null; }
function meUser() { return SESSION ? DB.users.find((u) => u.id === SESSION) : null; }
function pub(u) { return u && { id: u.id, name: u.name, email: u.email, phone: u.phone, role: u.role, round_id: u.round_id, group_id: u.group_id, job_title: u.job_title, base_salary: u.base_salary, hire_date: u.hire_date, active: u.active }; }
window.__resetDemo = () => { ST.del(LS); ST.del(LS + '_sess'); location.reload(); };

function seedDB() {
  const db = { _seq: 1000, _up: 0, uploads: {}, users: [], rounds: [], groups: [], enrollments: [], payments: [], reminders: [], videos: [], homeworks: [], submissions: [], quizzes: [], quiz_questions: [], quiz_attempts: [], notes: [], about: { id: 1, title: 'Dalia Bassel Couture', body: 'A couture academy specialized in teaching pattern-making and tailoring. Est. 2019.' }, dalia_posts: [], dresses: [], dress_fittings: [], dress_images: [], attendance: [], salaries: [], leaves: [] };
  const id = () => (db._seq = (db._seq || 1000) + 1);
  const admin = { id: id(), name: 'Dalia Bassel', email: 'admin@daliessa.com', phone: '', password: 'daliessa123', role: 'admin', active: 1 };
  db.users.push(admin);
  const round = { id: id(), number: 1, name: 'August Round', description: 'Basic pattern-making course', start_date: '2026-08-15', active: 1 };
  db.rounds.push(round);
  const gs = [['Group 1', 'friday', '11-3'], ['Group 2', 'friday', '5-9'], ['Group 3', 'saturday', '11-3'], ['Group 4', 'saturday', '5-9']]
    .map((g) => { const gg = { id: id(), round_id: round.id, name: g[0], day: g[1], time_slot: g[2], capacity: 6 }; db.groups.push(gg); return gg.id; });
  const trainees = [['Malak Ahmed', 'malak@d.com', 5000, 2000, gs[0]], ['Nour Mohamed', 'nour@d.com', 5000, 5000, gs[0]], ['Habiba Ali', 'habiba@d.com', 5000, 1500, gs[1]], ['Salma Khaled', 'salma@d.com', 5000, 3000, gs[2]], ['Reem Samy', 'reem@d.com', 5000, 0, gs[3]]];
  const tIds = trainees.map((t) => {
    const u = { id: id(), name: t[0], email: t[1], password: '123456', role: 'trainee', round_id: round.id, group_id: t[4], active: 1 };
    db.users.push(u); db.enrollments.push({ id: id(), user_id: u.id, round_id: round.id, total_fee: t[2] });
    if (t[3] > 0) db.payments.push({ id: id(), user_id: u.id, amount: t[3], kind: 'deposit', note: 'Deposit', paid_at: '2026-08-14' });
    return u.id;
  });
  db.reminders.push({ id: id(), user_id: tIds[0], due_date: '2026-09-01', amount: 3000, note: 'Course balance', done: 0 });
  db.reminders.push({ id: id(), user_id: tIds[3], due_date: '2026-09-05', amount: 2000, note: 'Second installment', done: 0 });
  db.videos.push({ id: id(), round_id: round.id, title: 'Pattern-making intro', description: 'Basics of drawing a pattern', url: 'https://youtu.be/dQw4w9WgXcQ' });
  db.videos.push({ id: id(), round_id: round.id, title: 'Taking measurements', description: 'The correct way to take measurements', url: 'https://youtu.be/dQw4w9WgXcQ' });
  db.homeworks.push({ id: id(), round_id: round.id, title: 'Basic bodice pattern', measurements: 'Bust 90 / Waist 72 / Hips 96 / Length 160', instructions: 'Draw the basic pattern and upload a photo.', due_date: '2026-08-22', created_at: nowIso() });
  db.notes.push({ id: id(), scope: 'round', round_id: round.id, title: 'Tools for the first class', body: 'You need: pattern paper, ruler, pencil, measuring tape.', created_at: '2026-08-14' });

/* ---- helpers on collections ---- */
const byId = (coll, id) => DB[coll].find((x) => x.id === Number(id));
const rm = (coll, id) => { DB[coll] = DB[coll].filter((x) => x.id !== Number(id)); };
const uname = (id) => (DB.users.find((u) => u.id === id) || {}).name || '';
function needAdmin() { const u = meUser(); if (!u || u.role !== 'admin') throw new Error('forbidden'); return u; }
function needAuth() { const u = meUser(); if (!u) throw new Error('unauthorized'); return u; }

/* ---- the mock api (async, mirrors server.js). Exposed as window.__localApi so app.js routes to it. ---- */
async function localApi(method, path, body) {
  const u = path.split('?')[0];
  const qs = new URLSearchParams((path.split('?')[1] || ''));
  const seg = u.split('/').filter(Boolean); // ['api', ...]
  const R = method + ' ' + u.replace(/\/\d+/g, '/:id').split('?')[0];
  const idIn = (u.match(/\/(\d+)/) || [])[1];
  const H = ROUTES[R];
  if (!H) throw new Error('route not found: ' + R);
  const res = H(body || {}, { id: idIn, qs, seg });
  persist();
  return res;
}
window.__localApi = localApi;

  'POST /api/leaves': (b) => { const me = needAuth(); const uid = me.role === 'admin' ? Number(b.user_id) : me.id; DB.leaves.push({ id: nid(), user_id: uid, from_date: b.from_date, to_date: b.to_date, type: b.type || 'annual', reason: b.reason || null, status: me.role === 'admin' ? (b.status || 'approved') : 'pending' }); return { ok: true }; },
  'PUT /api/leaves/:id': (b, x) => { needAdmin(); const l = byId('leaves', x.id); if (l) l.status = b.status; return { ok: true }; },
};
function byPaidDesc(a, c) { return (a.paid_at < c.paid_at ? 1 : -1); }

/* Rewrite /uploads/<key> image sources to their stored data URLs (demo has no server). */
function fixUploads(rootEl) {
  (rootEl || document).querySelectorAll('img[src^="/uploads/"],video[src^="/uploads/"]').forEach((el) => {
    const key = el.getAttribute('src').split('/uploads/')[1];
    if (DB.uploads[key]) el.setAttribute('src', DB.uploads[key]);
  });
}
new MutationObserver((muts) => { muts.forEach((m) => m.addedNodes.forEach((n) => { if (n.nodeType === 1) fixUploads(n.parentNode || n); })); }).observe(document.documentElement, { childList: true, subtree: true });

<script>
'use strict';
/* Dalia Bassel Couture — single-page app (vanilla JS). Website + installable PWA. */

/* ---------- tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const root = () => $('#root');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => (Number(n || 0)).toLocaleString('en-US') + ' EGP';
const dt = (s) => s ? String(s).slice(0, 10) : '—';
const initials = (n) => (n || '?').trim().slice(0, 2).toUpperCase();
const today = () => new Date().toISOString().slice(0, 10);

async function api(method, path, body) {
  if (window.__localApi) return window.__localApi(method, path, body); // demo mode (no server)
  const opt = { method, headers: {} };
  if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  let data = null; try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((data && data.error) || 'Connection error');
  return data;
}
const GET = (p) => api('GET', p);
const POST = (p, b) => api('POST', p, b);
const PUT = (p, b) => api('PUT', p, b);
const DEL = (p) => api('DELETE', p);

/* ensure a container exists even after body is re-rendered */
function ensureEl(id, cls) {
  let el = document.getElementById(id);
  if (!el) { el = document.createElement('div'); el.id = id; if (cls) el.className = cls; document.body.appendChild(el); }
  return el;
}
function toast(msg) {
  const t = ensureEl('toast', 'toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400);
}
function modal(html) {
  const mr = ensureEl('modal-root');
  mr.innerHTML = `<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal">
    <button class="close" onclick="closeModal()">✕</button>${html}</div></div>`;
}
function closeModal() { const m = document.getElementById('modal-root'); if (m) m.innerHTML = ''; }
window.closeModal = closeModal;

function lightbox(src, cap) {
  const mr = ensureEl('modal-root');
  mr.innerHTML = `<div class="lightbox" onclick="if(event.target===this)closeModal()">
    <button class="x" onclick="closeModal()">✕</button>
    <img src="${esc(src)}" alt=""/>${cap ? `<div class="cap">${esc(cap)}</div>` : ''}</div>`;
}
window.lightbox = lightbox;

/* pick an image file -> base64 data URL (compressed) */
function pickImage(cb, accept = 'image/*') {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = accept;
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    if (accept.startsWith('image')) compressImage(f, cb);
    else { const fr = new FileReader(); fr.onload = () => cb(fr.result); fr.readAsDataURL(f); }
  };
  inp.click();
}
function compressImage(file, cb) {
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 1280; let { width: w, height: h } = img;
      if (w > max || h > max) { const r = Math.min(max / w, max / h); w = Math.round(w * r); h = Math.round(h * r); }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => cb(fr.result);
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
window.pickImage = pickImage;

/* ripple effect on buttons (attached to document so it survives re-renders) */
document.addEventListener('pointerdown', (e) => {
  const btn = e.target.closest && e.target.closest('.btn');
  if (!btn) return;
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const rip = document.createElement('span');
  rip.className = 'ripple';
  rip.style.width = rip.style.height = size + 'px';
  rip.style.left = (e.clientX - rect.left - size / 2) + 'px';
  rip.style.top = (e.clientY - rect.top - size / 2) + 'px';
  if (/\b(sec|ghost|danger)\b/.test(btn.className)) rip.style.background = 'rgba(227,74,134,.20)';
  btn.appendChild(rip);
  setTimeout(() => rip.remove(), 600);
});

<script>
'use strict';
/* Dalia Bassel Couture — ADMIN pages */

/* generic form modal. fields: {name,label,type,options,required,value,accept,rows} */
function formModal(heading, fields, onSubmit, opts = {}) {
  const body = fields.map((f) => {
    if (f.type === 'hidden') return '';
    const v = f.value ?? '';
    if (f.type === 'select') {
      return `<label>${f.label}${f.required ? ' *' : ''}</label><select name="${f.name}">${
        (f.options || []).map((o) => `<option value="${esc(o.value)}" ${String(o.value) === String(v) ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
    }
    if (f.type === 'textarea') return `<label>${f.label}${f.required ? ' *' : ''}</label><textarea name="${f.name}" ${f.rows ? `style="min-height:${f.rows * 22}px"` : ''}>${esc(v)}</textarea>`;
    if (f.type === 'image' || f.type === 'file') {
      return `<label>${f.label}</label>
        <div class="row"><button type="button" class="btn ghost sm" onclick="pickForField('${f.name}','${f.type}','${f.accept || ''}')">📷 Choose ${f.type === 'file' ? 'file' : 'image'}</button>
        <span class="hint" id="fh_${f.name}" style="flex:2">${v ? 'Selected' : 'None'}</span></div>
        <input type="hidden" name="${f.name}" id="fi_${f.name}" value="${esc(v)}" />`;
    }
    return `<label>${f.label}${f.required ? ' *' : ''}</label><input name="${f.name}" type="${f.type || 'text'}" value="${esc(v)}" ${f.step ? `step="${f.step}"` : ''} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''} />`;
  }).join('');
  modal(`<h3>${esc(heading)}</h3><form id="fm">${body}<div class="err hidden" id="fmErr"></div>
    <button class="btn" type="submit" style="margin-top:16px">${esc(opts.submitLabel || 'Save')}</button></form>`);
  $('#fm').onsubmit = async (e) => {
    e.preventDefault();
    const data = {};
    fields.forEach((f) => {
      const el = $(`[name="${f.name}"]`, e.target); if (!el) return;
      let val = el.value;
      if (f.type === 'number') val = val === '' ? null : Number(val);
      data[f.name] = val;
    });
    try { await onSubmit(data); closeModal(); } catch (err) { const x = $('#fmErr'); x.textContent = err.message; x.classList.remove('hidden'); }
  };
}
window.pickForField = (name, type, accept) => pickImage((b64) => {
  $(`#fi_${name}`).value = b64; $(`#fh_${name}`).textContent = 'Selected ✓';

function videoEmbed(v) {
  if (v.file) return `<video controls style="width:100%;border-radius:10px;margin-top:6px" src="/uploads/${esc(v.file)}"></video>`;
  if (v.url) {

    return `<a class="btn sec sm" style="margin-top:6px" href="${esc(v.url)}" target="_blank">▶ Open video</a>`;
  }
  return '';
}

  } else if (tab === 'sal') {
    inner = `<button class="btn" onclick="addSalary()">＋ Salary</button>
      <div class="card" style="margin-top:12px"><div class="tbl-wrap"><table><thead><tr><th>Staff</th><th>Month</th><th>Base</th><th>Bonus</th><th>Deduct</th><th>Net</th><th></th></tr></thead>

        <td>${s.paid ? '<span class="badge ok">Paid</span>' : `<button class="btn sm ghost" onclick="paySalary(${s.id})">Pay</button>`}</td></tr>`).join('') : '<tr><td colspan="7" class="muted">No records</td></tr>'}</tbody></table></div></div>`;

  c.innerHTML = title('Staff', '') +
    `<div class="filters">${tabs.map(([k, l]) => `<span class="chip ${tab === k ? 'active' : ''}" onclick="staffTab('${k}')">${l}</span>`).join('')}</div>` + inner;

], async (d) => { await POST('/api/attendance', d); toast('Saved'); go('staff'); });
window.addSalary = () => formModal('Monthly salary', [
  { name: 'user_id', label: 'Staff', type: 'select', options: window._staff.map((s) => ({ value: s.id, label: s.name })) },
  { name: 'month', label: 'Month', type: 'month', value: today().slice(0, 7) },
  { name: 'base', label: 'Base', type: 'number' },
  { name: 'bonus', label: 'Bonus', type: 'number' },
  { name: 'deduction', label: 'Deduction', type: 'number' },
], async (d) => { await POST('/api/salaries', d); toast('Saved'); go('staff'); });

<script>
'use strict';
/* Dalia Bassel Couture — STUDENT / STAFF / CLIENT pages + role dispatch */

/* ---- role dispatch for the shared "home" nav key ---- */
PAGES.home = async (c) => {
  const r = state.user.role;
  if (r === 'admin') return PAGES.home_admin(c);
  if (r === 'staff') return PAGES.home_staff(c);
  return PAGES.home_trainee(c);
};

/* ============ STUDENT HOME ============ */
PAGES.home_trainee = async (c) => {
  const u = state.user;
  const [pay, quizzes, hw, notes, rounds] = await Promise.all([
    GET('/api/payments'), GET('/api/quizzes'), GET('/api/homeworks'), GET('/api/notes'), GET('/api/rounds'),
  ]);
  const round = rounds.find((r) => r.id === u.round_id);
  const paid = pay.reduce((a, p) => a + (p.amount || 0), 0);
  const pendingHw = hw.filter((h) => !h.my_submission).length;
  const newQuiz = quizzes.filter((q) => !q.my_attempt).length;
  c.innerHTML = title(`Welcome, ${u.name}`, '') + `
    <div class="card">
      <div class="sec-title">Your round</div>
      ${round ? `<div class="nm serif" style="font-size:18px">${esc(round.name)}${round.number ? ' · Round ' + round.number : ''}</div>
        <div class="sub muted">${round.start_date ? 'Starts ' + dt(round.start_date) : ''} ${round.description ? '· ' + esc(round.description) : ''}</div>` : '<div class="muted">Not enrolled in a round yet</div>'}
    </div>
    <div class="grid g3">
      <div class="stat" onclick="go('mypay')"><div class="n">${money(paid)}</div><div class="l">Paid</div></div>
      <div class="stat" onclick="go('homework')"><div class="n">${pendingHw}</div><div class="l">Tasks due</div></div>
      <div class="stat" onclick="go('quizzes')"><div class="n">${newQuiz}</div><div class="l">New quiz</div></div>
    </div>
    <div class="sec-title">Menu</div>
    <div class="tiles">
      ${[['courses', '🎬', 'Courses'], ['homework', '✎', 'Tasks'], ['quizzes', '📝', 'Quizzes'], ['notes', '📌', 'Notes'], ['mypay', '💳', 'Account'], ['about', 'ℹ', 'About']]
      .map(([p, e, t]) => `<div class="tile" onclick="go('${p}')"><div class="em">${e}</div><div class="t">${t}</div></div>`).join('')}
    </div>
    ${notes.length ? `<div class="sec-title">Latest notes</div>${notes.slice(0, 3).map((n) => `<div class="card"><div class="nm" style="font-weight:600">${esc(n.title)}</div>${n.body ? `<div style="font-size:13px">${esc(n.body)}</div>` : ''}</div>`).join('')}` : ''}`;
};

/* ============ STUDENT COURSES (videos, read-only) ============ */
PAGES.courses_trainee = async (c) => {
  const videos = await GET('/api/videos');
  c.innerHTML = title('Courses', '') +
    (videos.length ? videos.map((v) => `<div class="card">
      <div class="nm" style="font-weight:600">${esc(v.title)}</div>
      ${v.description ? `<div style="font-size:13px;margin:6px 0">${esc(v.description)}</div>` : ''}

};

/* ============ STUDENT TASKS ============ */
PAGES.homework_trainee = async (c) => {
  const hw = await GET('/api/homeworks');
  c.innerHTML = title('Tasks', '') +
    (hw.length ? hw.map((h) => `<div class="card">
      <div class="nm" style="font-weight:600">${esc(h.title)}</div>
      <div class="sub muted">${h.due_date ? 'Due ' + dt(h.due_date) : ''}</div>
      ${h.measurements ? `<div class="hint">Measurements: ${esc(h.measurements)}</div>` : ''}
      ${h.instructions ? `<div class="hint">${esc(h.instructions)}</div>` : ''}
      ${h.my_submission ? `<div class="item" style="margin-top:8px">
          ${h.my_submission.image ? `<img class="thumb" style="width:54px;height:54px;aspect-ratio:1" src="/uploads/${esc(h.my_submission.image)}" onclick="lightbox('/uploads/${esc(h.my_submission.image)}')"/>` : '▤'}
          <div class="main"><div class="nm">Submitted ✓</div><div class="sub">${dt(h.my_submission.submitted_at)}${h.my_submission.grade ? ' · ' + esc(h.my_submission.grade) : ''}</div>
          ${h.my_submission.feedback ? `<div class="hint">${esc(h.my_submission.feedback)}</div>` : ''}</div>
          <button class="btn sm sec" onclick="submitHw(${h.id})">Edit</button></div>`
        : `<button class="btn" style="margin-top:8px" onclick="submitHw(${h.id})">Upload pattern</button>`}
    </div>`).join('') : empty('No tasks yet', '✎'));
};
window.submitHw = (id) => {
  modal(`<h3>Upload pattern</h3>
    <div class="row"><button class="btn ghost" onclick="hwPic()">📷 Pattern photo</button></div>
    <img id="hwPrev" class="thumb hidden" style="aspect-ratio:3/4;margin-top:10px"/>
    <label>Note (optional)</label><textarea id="hwNote"></textarea>
    <button class="btn" style="margin-top:12px" onclick="doSubmitHw(${id})">Submit</button>`);
  window._hwImg = null;
};
window.hwPic = () => pickImage((b) => { window._hwImg = b; const p = $('#hwPrev'); p.src = b; p.classList.remove('hidden'); });
window.doSubmitHw = async (id) => {
  if (!window._hwImg) return toast('Choose the pattern photo');
  await POST(`/api/homeworks/${id}/submit`, { image: window._hwImg, note: $('#hwNote').value });
  closeModal(); toast('Submitted ✓'); go('homework');
};

/* ============ STUDENT QUIZZES ============ */
PAGES.quizzes_trainee = async (c) => {
  const quizzes = await GET('/api/quizzes');
  c.innerHTML = title('Quizzes', '') +
    (quizzes.length ? quizzes.map((q) => `<div class="card">
      <div class="item"><div class="av">📝</div>
        <div class="main"><div class="nm">${esc(q.title)} <span class="badge">${q.ref_code}</span></div>
          <div class="sub">${q.questions_count} questions · ${q.duration_min} min</div></div>
        ${q.my_attempt ? `<span class="badge ok">${q.my_attempt.score}/${q.my_attempt.total}</span>` : `<button class="btn sm" onclick="startQuiz(${q.id})">Start</button>`}</div>
      <button class="btn sec sm" style="margin-top:6px" onclick="quizResults(${q.id},'${esc(q.title)}')">All results</button>
    </div>`).join('') : empty('No quizzes available', '📝'));
};
let _quizState = null;
window.startQuiz = async (id) => {
  const quiz = await GET('/api/quizzes/' + id);
  if (!quiz.questions.length) return toast('This quiz has no questions yet');
  _quizState = { quiz, answers: {}, endsAt: Date.now() + quiz.duration_min * 60000 };
  renderQuizRunner();
};
function renderQuizRunner() {
  const { quiz } = _quizState;
  modal(`<h3>${esc(quiz.title)}</h3>
    <div class="right"><span class="q-timer" id="qTimer"></span></div>
    <div id="qBody">${quiz.questions.map((q, i) => `<div class="card" style="padding:12px">
      <div class="nm" style="font-weight:600">${i + 1}. ${esc(q.text)}</div>
      ${q.options.map((o, oi) => `<label class="opt" id="opt_${q.id}_${oi}" onclick="pickAns(${q.id},${oi})">${esc(o)}</label>`).join('')}
    </div>`).join('')}</div>
    <button class="btn" onclick="finishQuiz()">Submit quiz</button>`);
  tickTimer();
}
window.pickAns = (qid, oi) => {
  _quizState.answers[qid] = oi;
  _quizState.quiz.questions.find((q) => q.id === qid).options.forEach((_, i) => $(`#opt_${qid}_${i}`).classList.toggle('sel', i === oi));
};
function tickTimer() {
  const el = $('#qTimer'); if (!el || !_quizState) return;
  const left = Math.max(0, _quizState.endsAt - Date.now());
  const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
  el.textContent = `${m}:${String(s).padStart(2, '0')}`;
  if (left <= 0) { finishQuiz(); return; }
  _quizState.timer = setTimeout(tickTimer, 1000);
}
window.finishQuiz = async () => {
  if (!_quizState) return;
  clearTimeout(_quizState.timer);
  const { quiz, answers } = _quizState; _quizState = null;
  const r = await POST(`/api/quizzes/${quiz.id}/attempt`, { answers });
  modal(`<h3>Your score</h3><div class="stat" style="margin:10px 0"><div class="n">${r.score} / ${r.total}</div><div class="l">${esc(quiz.title)}</div></div>
    <button class="btn sec" onclick="quizResults(${quiz.id},'${esc(quiz.title)}')">See all results</button>
    <button class="btn" style="margin-top:8px" onclick="closeModal();go('quizzes')">Done</button>`);
};

      ${n.body ? `<div style="font-size:14px;margin-top:6px">${esc(n.body)}</div>` : ''}</div>`).join('') : empty('No notes yet', '📌'));
};

PAGES.mypay = async (c) => {
  const pay = await GET('/api/payments');
  const rem = await GET('/api/reminders');
  const paid = pay.reduce((a, p) => a + (p.amount || 0), 0);
  c.innerHTML = title('My Account', '') + `
    <div class="grid g2"><div class="stat"><div class="n">${money(paid)}</div><div class="l">Total paid</div></div>
      <div class="stat"><div class="n">${pay.length}</div><div class="l">Payments</div></div></div>
    <div class="sec-title">My payments</div>
    <div class="card">${pay.length ? pay.map((p) => `<div class="item">
      <div class="av">${p.image ? `<img class="thumb" style="width:44px;height:44px;aspect-ratio:1" src="/uploads/${esc(p.image)}" onclick="lightbox('/uploads/${esc(p.image)}')"/>` : '💵'}</div>
      <div class="main"><div class="nm">${money(p.amount)}</div><div class="sub">${p.kind === 'deposit' ? 'Deposit' : 'Installment'} · ${dt(p.paid_at)}${p.note ? ' · ' + esc(p.note) : ''}</div></div></div>`).join('') : empty('No payments yet', '💵')}</div>
    ${rem.filter((r) => !r.done).length ? `<div class="sec-title">Upcoming payments</div><div class="card">${rem.filter((r) => !r.done).map((r) => `<div class="item"><div class="av">◷</div><div class="main"><div class="nm">${dt(r.due_date)}</div><div class="sub">${money(r.amount)}${r.note ? ' · ' + esc(r.note) : ''}</div></div></div>`).join('')}</div>` : ''}`;
};

/* ============ ABOUT (view for non-admin) ============ */
PAGES.about_view = async (c, a) => {
  a = a || await GET('/api/about');
  c.innerHTML = title(a.title || 'Dalia Bassel Couture', '') + `<div class="card">
    ${a.image ? `<img class="thumb" style="aspect-ratio:16/9;margin-bottom:10px" src="/uploads/${esc(a.image)}" onclick="lightbox('/uploads/${esc(a.image)}')"/>` : ''}
    <div style="font-size:15px;white-space:pre-wrap">${esc(a.body || 'A couture academy for pattern-making and tailoring.')}</div></div>`;
};

/* ============ STAFF HOME (attendance) ============ */
PAGES.home_staff = async (c) => {
  const att = await GET('/api/attendance');
  const todayRec = att.find((a) => a.date === today());
  let label = 'Check in', ic = '●';
  if (todayRec && todayRec.check_in && !todayRec.check_out) { label = 'Check out'; ic = '◐'; }
  else if (todayRec && todayRec.check_out) { label = 'Done for today ✓'; ic = '✓'; }
  c.innerHTML = title(`Welcome, ${state.user.name}`, '') + `
    <div class="card" style="text-align:center">
      <div style="font-size:40px">${ic}</div>
      <div class="nm" style="font-weight:600;font-size:16px;margin:8px 0">${todayRec ? `In: ${todayRec.check_in || '—'} · Out: ${todayRec.check_out || '—'}` : 'No attendance today yet'}</div>
      ${todayRec && todayRec.check_out ? '' : `<button class="btn" onclick="doCheck()">${label}</button>`}
    </div>
    <div class="sec-title">Recent attendance</div>
    <div class="card"><div class="tbl-wrap"><table><thead><tr><th>Day</th><th>In</th><th>Out</th></tr></thead>
      <tbody>${att.length ? att.slice(0, 30).map((a) => `<tr><td>${dt(a.date)}</td><td>${a.check_in || '—'}</td><td>${a.check_out || '—'}</td></tr>`).join('') : '<tr><td colspan="3" class="muted">No records</td></tr>'}</tbody></table></div></div>`;
};
window.doCheck = async () => { const r = await POST('/api/attendance/check'); toast(r.action === 'in' ? 'Checked in' : r.action === 'out' ? 'Checked out' : 'Done'); go('home'); };

/* ============ STAFF SALARY ============ */
PAGES.mysalary = async (c) => {
  const sal = await GET('/api/salaries');
  const total = sal.filter((s) => s.paid).reduce((a, s) => a + s.net, 0);
  c.innerHTML = title('My Salary', '') + `
    <div class="grid g2"><div class="stat"><div class="n">${money(state.user.base_salary)}</div><div class="l">Base</div></div>
      <div class="stat"><div class="n">${money(total)}</div><div class="l">Received</div></div></div>
    <div class="card"><div class="tbl-wrap"><table><thead><tr><th>Month</th><th>Base</th><th>Bonus</th><th>Deduct</th><th>Net</th><th></th></tr></thead>
      <tbody>${sal.length ? sal.map((s) => `<tr><td>${esc(s.month)}</td><td>${money(s.base)}</td><td>${money(s.bonus)}</td><td>${money(s.deduction)}</td><td>${money(s.net)}</td><td>${s.paid ? '<span class="badge ok">Paid</span>' : '<span class="badge warn">Pending</span>'}</td></tr>`).join('') : '<tr><td colspan="6" class="muted">No records</td></tr>'}</tbody></table></div></div>`;
};

/* ============ STAFF LEAVES ============ */
PAGES.myleaves = async (c) => {
  const lv = await GET('/api/leaves');
  c.innerHTML = title('My Leaves', '') +
    `<button class="btn" onclick="requestLeave()">＋ Request leave</button>
    <div class="card" style="margin-top:12px">${lv.length ? lv.map((l) => `<div class="item"><div class="av">🌴</div>
      <div class="main"><div class="nm">${dt(l.from_date)} → ${dt(l.to_date)}</div><div class="sub">${leaveEn(l.type)}${l.reason ? ' · ' + esc(l.reason) : ''}</div></div>
      <span class="badge ${l.status === 'approved' ? 'ok' : l.status === 'rejected' ? 'bad' : 'warn'}">${l.status === 'approved' ? 'Approved' : l.status === 'rejected' ? 'Rejected' : 'Pending'}</span></div>`).join('') : empty('No leaves yet', '🌴')}</div>`;
};
window.requestLeave = () => formModal('Request leave', [
  { name: 'from_date', label: 'From', type: 'date', required: true, value: today() },
  { name: 'to_date', label: 'To', type: 'date', required: true, value: today() },
  { name: 'type', label: 'Type', type: 'select', options: [{ value: 'annual', label: 'Annual' }, { value: 'sick', label: 'Sick' }, { value: 'unpaid', label: 'Unpaid' }] },
  { name: 'reason', label: 'Reason', type: 'textarea' },
], async (d) => { await POST('/api/leaves', d); toast('Sent for approval'); go('myleaves'); });

/* ============ CLIENT DRESSES ============ */
PAGES.mydresses = async (c) => {
  const dresses = await GET('/api/dresses');
  const stEn = { open: 'In preparation', in_progress: 'In progress', delivered: 'Ready' };
  c.innerHTML = title('My Dresses', '') +
    (dresses.length ? dresses.map((d) => `<div class="card">
      <div class="nm serif" style="font-size:18px">${esc(d.customer_name)} <span class="badge ${d.status === 'delivered' ? 'ok' : 'warn'}">${stEn[d.status] || d.status}</span></div>
      <div class="sub muted">Delivery: ${dt(d.delivery_date)}</div>
      ${d.fittings.length ? `<div class="sec-title">Fitting dates</div>${d.fittings.map((f) => `<div class="item"><div class="av">${f.done ? '✓' : '◷'}</div><div class="main"><div class="nm">${dt(f.fitting_date)}</div><div class="sub">${f.note ? esc(f.note) : ''}</div></div></div>`).join('')}` : ''}
      ${d.images.length ? `<div class="sec-title">Dress photos</div><div class="gallery">${d.images.map((im) => `<img class="thumb" style="aspect-ratio:3/4" src="/uploads/${esc(im.image)}" onclick="lightbox('/uploads/${esc(im.image)}','${esc(im.caption || d.customer_name)}')"/>`).join('')}</div>` : ''}
    </div>`).join('') : empty('No bookings yet', '👗'));
};

</script>
<script>

/* --- demo-only overrides --- */
videoEmbed = function (v) {
  if (v.file) return '<video controls style="width:100%;border-radius:12px;margin-top:6px" src="/uploads/' + v.file + '"></video>';
  if (v.url) return '<a class="btn sec sm" style="margin-top:6px" href="' + esc(v.url) + '" target="_blank" rel="noopener">▶ Open video</a>';
  return '';
};
function ensureFab() {
  if (document.getElementById('demoReset')) return;
  if (!document.querySelector('#nav')) return; // only when logged in
  var b = document.createElement('button');
  b.id = 'demoReset'; b.textContent = '↺ Reset demo';
  b.style.cssText = 'position:fixed;bottom:96px;inset-inline-start:12px;z-index:70;background:#fff;color:#c62f6c;border:1.5px solid #f4e1eb;border-radius:24px;padding:8px 14px;font:inherit;font-size:12px;font-weight:700;letter-spacing:.5px;box-shadow:0 6px 24px rgba(198,47,108,.18);cursor:pointer';
  b.onclick = function () { if (confirm('Reset all demo data back to the start?')) window.__resetDemo(); };
  document.body.appendChild(b);
}
setInterval(ensureFab, 700);

</script>
</body>
